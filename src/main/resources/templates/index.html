<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Collectors Yays and Nays</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand"
           href="/">
            Collectors Yays and Nays
        </a>

    </div>
</nav>


<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">



            <div class="card shadow-sm mb-4">

                <div class="card-header">
                    <h5 class="mb-0">
                        Process ManaBox Scan
                    </h5>
                </div>

                <div class="card-body">

                    <form method="post"
                          action="/process"
                          enctype="multipart/form-data">

                        <div class="mb-3">

                            <label for="file"
                                   class="form-label">
                                ManaBox CSV file
                            </label>

                            <input class="form-control"
                                   type="file"
                                   id="file"
                                   name="file"
                                   accept=".csv"
                                   required>

                        </div>

                        <button type="submit"
                                class="btn btn-primary">
                            Process Scan
                        </button>

                    </form>

                </div>

            </div>




            <div class="card shadow-sm mb-4"
                 th:if="${collectionCount != null}">

                <div class="card-header">
                    <h5 class="mb-0">
                        Current Scan
                    </h5>
                </div>

                <div class="card-body">

                    <div class="row g-3">



                        <div class="col-md-4">

                            <div class="border rounded p-3 h-100">

                                <h6>
                                    Collection Worthy
                                </h6>

                                <p class="display-6"
                                   th:text="${collectionCount}">
                                    0
                                </p>

                                <a href="/download/collection"
                                   class="btn btn-success w-100">
                                    Download
                                </a>

                            </div>

                        </div>




                        <div class="col-md-4">

                            <div class="border rounded p-3 h-100">

                                <h6>
                                    Maybe
                                </h6>

                                <p class="display-6"
                                   th:text="${maybeCount}">
                                    0
                                </p>

                                <a href="/download/maybe"
                                   class="btn btn-warning w-100">
                                    Download
                                </a>

                            </div>

                        </div>




                        <div class="col-md-4">

                            <div class="border rounded p-3 h-100">

                                <h6>
                                    Previously Seen
                                </h6>

                                <p class="display-6"
                                   th:text="${seenCount}">
                                    0
                                </p>

                                <a href="/download/seen"
                                   class="btn btn-secondary w-100">
                                    Download
                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- History -->

            <div class="card shadow-sm">

                <div class="card-header">
                    <h5 class="mb-0">
                        Scan History
                    </h5>
                </div>

                <div class="card-body">

                    <p class="text-muted">
                        The scan history contains cards encountered
                        during previous reads and is used for duplicate detection.
                    </p>

                    <a href="/download/history"
                       class="btn btn-outline-primary">
                        Download History
                    </a>

                    <a href="/history/clear"
                       class="btn btn-outline-danger">
                        Clear History
                    </a>

                </div>

            </div>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
